<!-- HTML5 Document -->
<!DOCTYPE html>

<html>

<head>

    <!-- Browser Tab Title -->
    <title>Login Form</title>

</head>

<body>

<!-- Main Heading -->
<h2>Login Form</h2>

<!-- Form Starts -->

<!-- action="/check" -->
<!-- Sends data to /check route -->

<!-- method="POST" -->
<!-- Uses POST method -->

<form action="/check" method="POST">

    Username :

    <!-- Textbox -->
    <!-- name="username" -->
    <!-- This name becomes req.body.username -->

    <input type="text" name="username">

    <br><br>

    Password :

    <!-- Password Box -->
    <!-- Hidden while typing -->

    <input type="password" name="password">

    <br><br>

    <!-- Submit Button -->

    <input type="submit" value="Login">

</form>

</body>

</html>
